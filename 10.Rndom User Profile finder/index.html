<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Random User profile Finder</h1>
    <div class="container">
      <button id="btn">Get Random User</button>

      <p id="loading">Loading...</p>

      <p id="error"></p>

      <div class="card" id="card">
        <img id="userImg" src="" alt="User Image" />

        <h2 id="name"></h2>

        <p id="email"></p>

        <p id="country"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
